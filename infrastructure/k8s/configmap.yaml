apiVersion: v1
kind: ConfigMap
metadata:
  name: kenkomirai-config
  namespace: kenkomirai
data:
  KENKOMIRAI_ENVIRONMENT: production
  KENKOMIRAI_LOG_LEVEL: INFO
  KENKOMIRAI_CORS_ORIGINS: https://kenkomirai.example.com
  KENKOMIRAI_ALLOWED_HOSTS: kenkomirai-backend,localhost,127.0.0.1
  KENKOMIRAI_MAX_AGENTS: "10000"
  KENKOMIRAI_MAX_STEPS_PER_REQUEST: "720"
  KENKOMIRAI_MAX_TOTAL_STEPS_PER_SESSION: "10000"
  KENKOMIRAI_MAX_WORK_UNITS: "2500000"
  KENKOMIRAI_MAX_CONCURRENT_RUNS: "2"
  KENKOMIRAI_MAX_SESSIONS: "64"
  KENKOMIRAI_MAX_RETAINED_AGENTS: "50000"
  KENKOMIRAI_SESSION_TTL_SECONDS: "3600"
  KENKOMIRAI_API_URL: http://kenkomirai-backend:8000
  KENKOMIRAI_GATEWAY_TIMEOUT_MS: "120000"
